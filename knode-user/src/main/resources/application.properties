spring.application.name=knode-user
spring.sql.init.mode=never
spring.datasource.url=${KNODE_USER_DB_URL}
spring.datasource.username=${KNODE_USER_DB_USERNAME}
spring.datasource.password=${KNODE_USER_DB_PASSWORD}
server.error.include-message=never

server.port=${USER_PORT:18090}

spring.cloud.nacos.discovery.enabled=${USER_NACOS_DISCOVERY_ENABLED:false}
spring.cloud.nacos.config.enabled=false
spring.cloud.nacos.discovery.server-addr=${USER_NACOS_SERVER_ADDR:${NACOS_SERVER_ADDR:}}
spring.cloud.nacos.discovery.namespace=${USER_NACOS_NAMESPACE:${NACOS_NAMESPACE:}}
spring.cloud.nacos.discovery.group=${USER_NACOS_GROUP:${NACOS_GROUP:}}
spring.cloud.nacos.discovery.username=${USER_NACOS_USERNAME:${NACOS_USERNAME:}}
spring.cloud.nacos.discovery.password=${USER_NACOS_PASSWORD:${NACOS_PASSWORD:}}
knode.governance.enabled=${USER_GOVERNANCE_ENABLED:false}
knode.governance.nacos.server-addr=${USER_NACOS_SERVER_ADDR:${NACOS_SERVER_ADDR:}}
knode.governance.nacos.namespace=${USER_NACOS_NAMESPACE:${NACOS_NAMESPACE:}}
knode.governance.nacos.group=${USER_GOVERNANCE_GROUP:}
knode.governance.nacos.username=${USER_NACOS_USERNAME:${NACOS_USERNAME:}}
knode.governance.nacos.password=${USER_NACOS_PASSWORD:${NACOS_PASSWORD:}}
knode.observability.enabled=${USER_OBSERVABILITY_ENABLED:false}
knode.observability.environment=${USER_OBSERVABILITY_ENVIRONMENT:}
knode.observability.version=${USER_OBSERVABILITY_VERSION:}
management.tracing.enabled=${USER_OBSERVABILITY_ENABLED:false}
management.otlp.tracing.endpoint=${USER_OTLP_ENDPOINT:}
management.tracing.sampling.probability=${USER_TRACING_SAMPLE_RATE:0.1}
management.server.address=127.0.0.1
management.server.port=${USER_MANAGEMENT_PORT:19092}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,userReadiness
