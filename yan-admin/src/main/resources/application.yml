server:
  port: 8989
management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: YanBlog
info:
  app:
    name: YanBlog
    description: 多模块内容平台
    version: 1.0-SNAPSHOT
logging:
  file:
    name: logs/yanblog.log
  pattern:
    level: "%5p requestId=%X{requestId:-}"
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/yan_blog?characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 806312
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 5MB
  data:
    redis:
      port: 6379
      password: redispassword
      host: 192.168.25.129
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
blog:
  observability:
    slow-request-threshold-ms: 500
  search:
    elasticsearch:
      url: http://192.168.25.129:9200
      index-name: yan_blog_articles
    sync:
      core-pool-size: 4
      max-pool-size: 8
      queue-capacity: 20
      keep-alive-seconds: 60
    outbox:
      poll-delay-ms: 1000
      lease-seconds: 30
      batch-size: 100
      retry-delay-seconds: 10
      max-retry-delay-seconds: 300
  notification:
    large-author-threshold: 10000
    fanout:
      batch-size: 500
    outbox:
      poll-delay-ms: 500
      poll-batch-size: 20
      lease-seconds: 30
