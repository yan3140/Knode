server:
  port: 8989
  tomcat:
    accept-count: 1000
    max-connections: 10000
    threads:
      max: 400
      min-spare: 50
management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: YanBlog
info:
  app:
    name: YanBlog
    description: 多模块内容平台
    version: 1.0-SNAPSHOT
logging:
  file:
    name: logs/yanblog.log
  pattern:
    level: "%5p requestId=%X{requestId:-}"
spring:
  config:
    import: optional:file:.env[.properties]
  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: yanblog-scheduler-
  datasource:
    url: jdbc:mysql://localhost:3306/yan_blog?characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 806312
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 5MB
  data:
    redis:
      port: 6379
      password: redispassword
      host: 192.168.25.129
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
blog:
  agent:
    gateway:
      base-url: ${YANBLOG_AGENT_GATEWAY_BASE_URL:http://127.0.0.1:8990}
      connect-timeout-seconds: ${YANBLOG_AGENT_GATEWAY_CONNECT_TIMEOUT_SECONDS:3}
      request-timeout-seconds: ${YANBLOG_AGENT_GATEWAY_REQUEST_TIMEOUT_SECONDS:120}
    internal:
      enabled: ${YANBLOG_AGENT_INTERNAL_ENABLED:false}
      service-key: ${YANBLOG_AGENT_SERVICE_KEY:}
      principal-jwt-secret: ${YANBLOG_AGENT_PRINCIPAL_JWT_SECRET:}
      principal-jwt-ttl-seconds: ${YANBLOG_AGENT_PRINCIPAL_JWT_TTL_SECONDS:60}
  ai:
    agent:
      api-key: ${OPENAI_API_KEY:}
      responses-url: ${YANBLOG_AGENT_RESPONSES_URL:https://api.wenwenai.org/v1/responses}
      model: ${YANBLOG_AGENT_MODEL:gpt-5.6}
      reasoning-effort: ${YANBLOG_AGENT_REASONING_EFFORT:medium}
      stream: ${YANBLOG_AGENT_STREAM:false}
      store: ${YANBLOG_AGENT_STORE:false}
  knowledge:
    search:
      index-name: ${YANBLOG_KNOWLEDGE_INDEX_NAME:yan_knowledge_chunks_v1}
      vector-candidate-similarity: ${YANBLOG_KNOWLEDGE_VECTOR_CANDIDATE_SIMILARITY:0.56}
      vector-evidence-similarity: ${YANBLOG_KNOWLEDGE_VECTOR_EVIDENCE_SIMILARITY:0.65}
      vector-strong-similarity: ${YANBLOG_KNOWLEDGE_VECTOR_STRONG_SIMILARITY:0.72}
    embedding:
      provider: ${YANBLOG_EMBEDDING_PROVIDER:zhipu-openai-compatible}
      api-key: ${ZHIPU_KEY:}
      base-url: ${YANBLOG_EMBEDDING_BASE_URL:https://open.bigmodel.cn/api/paas/v4/}
      model: ${YANBLOG_EMBEDDING_MODEL:embedding-3}
      dimensions: ${YANBLOG_EMBEDDING_DIMENSIONS:1024}
    index:
      keyword-enabled: true
      vector-enabled: true
      chunking-policy-version: markdown-heading-v1
      keyword-schema-version: elasticsearch-standard-v1
      require-keyword: true
      require-vector: false
      allow-partial: true
    outbox:
      poll-delay-ms: 1000
      lease-seconds: 60
      batch-size: 100
      retry-delay-seconds: 10
      max-retry-delay-seconds: 300
      max-retry: 8
      stream:
        enabled: false
        key: yanblog:stream:knowledge-index
        group: yanblog-knowledge-index
        consumer: yanblog-admin
        poll-delay-ms: 200
        batch-size: 50
        consumer-count: 2
        max-len: 100000
  cache:
    invalidation:
      poll-delay-ms: 1000
      poll-batch-size: 50
      lease-seconds: 30
      retry-delay-seconds: 10
      max-retry-delay-seconds: 300
      max-retry: 8
  reliable-task:
    redis-stream:
      enabled: true
      max-len: 100000
      streams:
        article-search: yanblog:stream:article-search
        notification-fanout: yanblog:stream:notification-fanout
        notification-delivery: yanblog:stream:notification-delivery
        cache-invalidate: yanblog:stream:cache-invalidate
      groups:
        article-search: yanblog-article-search-sync
        notification-fanout: yanblog-notification-fanout
        notification-delivery: yanblog-notification-delivery
        cache-invalidate: yanblog-cache-invalidate
      consumers:
        article-search: yanblog-admin
        notification-fanout: yanblog-admin
        notification-delivery: yanblog-admin
        cache-invalidate: yanblog-admin
  observability:
    slow-request-threshold-ms: 500
  search:
    elasticsearch:
      url: http://192.168.25.129:9200
      index-name: yan_blog_articles
    query:
      default-page-size: 5
      max-page-size: 20
      max-page-num: 50
      max-keyword-length: 40
      total-hit-threshold: 10000
      highlight-content: false
      cache:
        enabled: true
        max-page-size: 20
        admission-threshold: 2
        admission-ttl-seconds: 60
        result-ttl-seconds: 60
        empty-ttl-seconds: 30
        jitter-seconds: 30
    sync:
      core-pool-size: 4
      max-pool-size: 8
      queue-capacity: 20
      keep-alive-seconds: 60
    outbox:
      stream:
        enabled: true
        poll-delay-ms: 100
        consumer-batch-size: 200
        # Logical consumer names polled sequentially, not concurrent worker threads.
        consumer-count: 4
      poll-delay-ms: 1000
      lease-seconds: 60
      batch-size: 200
      retry-delay-seconds: 10
      max-retry-delay-seconds: 300
      max-retry: 8
  notification:
    large-author-threshold: 10000
    fanout:
      batch-size: 500
    outbox:
      stream:
        enabled: true
        poll-delay-ms: 200
        consumer-batch-size: 20
        consumer-count: 2
      poll-delay-ms: 500
      poll-batch-size: 20
      lease-seconds: 30
      retry-delay-seconds: 10
      max-retry-delay-seconds: 300
      max-retry: 8
    delivery-outbox:
      stream:
        enabled: true
        poll-delay-ms: 200
        consumer-batch-size: 50
        consumer-count: 2
      poll-delay-ms: 500
      poll-batch-size: 50
      lease-seconds: 30
      retry-delay-seconds: 10
      max-retry-delay-seconds: 300
      max-retry: 8
