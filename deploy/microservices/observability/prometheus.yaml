global:
  scrape_interval: 5s
  scrape_timeout: 3s
scrape_configs:
  - job_name: knode-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["127.0.0.1:19089"]
  - job_name: knode-java-fixture
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["127.0.0.1:19090"]
