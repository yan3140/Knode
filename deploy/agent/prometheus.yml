global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/agent-alerts.yml

scrape_configs:
  - job_name: yan-agent-api
    metrics_path: /metrics
    static_configs:
      - targets: [yan-agent:8990]

  - job_name: yan-agent-worker
    metrics_path: /
    static_configs:
      - targets: [yan-agent-worker:8991]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
