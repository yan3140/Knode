global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - agent-alerts.yml

scrape_configs:
  - job_name: yan-agent-api
    metrics_path: /metrics
    static_configs:
      - targets: [127.0.0.1:8990]

  - job_name: yan-agent-worker
    metrics_path: /
    static_configs:
      - targets: [127.0.0.1:8991]

  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:19090]
