spring.application.name=knode-community
spring.datasource.url=${KNODE_COMMUNITY_JDBC_URL}
spring.datasource.username=${KNODE_COMMUNITY_DB_USERNAME}
spring.datasource.password=${KNODE_COMMUNITY_DB_PASSWORD}
spring.datasource.hikari.connection-timeout=750
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.liquibase.enabled=false

spring.data.redis.host=${KNODE_AUTH_REDIS_HOST}
spring.data.redis.port=${KNODE_AUTH_REDIS_PORT}
spring.data.redis.username=${KNODE_AUTH_REDIS_USERNAME}
spring.data.redis.password=${KNODE_AUTH_REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=false
management.endpoint.health.group.readiness.include=readinessState,db,authSession,communityDiscovery,communityGovernance
management.endpoint.health.show-details=never
management.server.port=${KNODE_MANAGEMENT_PORT}
management.server.address=127.0.0.1

server.address=127.0.0.1
server.port=${KNODE_COMMUNITY_PORT}
server.forward-headers-strategy=none

spring.cloud.nacos.discovery.enabled=${COMMUNITY_NACOS_DISCOVERY_ENABLED:false}
spring.cloud.nacos.config.enabled=false
spring.cloud.nacos.discovery.server-addr=${COMMUNITY_NACOS_SERVER_ADDR:${NACOS_SERVER_ADDR:}}
spring.cloud.nacos.discovery.namespace=${COMMUNITY_NACOS_NAMESPACE:${NACOS_NAMESPACE:}}
spring.cloud.nacos.discovery.group=${COMMUNITY_NACOS_GROUP:${NACOS_GROUP:DEFAULT_GROUP}}
spring.cloud.nacos.discovery.username=${COMMUNITY_NACOS_USERNAME:${NACOS_USERNAME:}}
spring.cloud.nacos.discovery.password=${COMMUNITY_NACOS_PASSWORD:${NACOS_PASSWORD:}}

knode.governance.enabled=${COMMUNITY_GOVERNANCE_ENABLED:false}
knode.governance.nacos.server-addr=${COMMUNITY_NACOS_SERVER_ADDR:${NACOS_SERVER_ADDR:}}
knode.governance.nacos.namespace=${COMMUNITY_NACOS_NAMESPACE:${NACOS_NAMESPACE:}}
knode.governance.nacos.group=${COMMUNITY_GOVERNANCE_GROUP:KNODE_SENTINEL}
knode.governance.nacos.username=${COMMUNITY_NACOS_USERNAME:${NACOS_USERNAME:}}
knode.governance.nacos.password=${COMMUNITY_NACOS_PASSWORD:${NACOS_PASSWORD:}}

knode.observability.enabled=${COMMUNITY_OBSERVABILITY_ENABLED:false}
knode.observability.environment=${COMMUNITY_OBSERVABILITY_ENVIRONMENT:${KNODE_ENVIRONMENT:}}
knode.observability.version=${COMMUNITY_OBSERVABILITY_VERSION:}
management.opentelemetry.resource-attributes[service.name]=${spring.application.name}
management.opentelemetry.resource-attributes[service.version]=${COMMUNITY_OBSERVABILITY_VERSION:}
management.opentelemetry.resource-attributes[deployment.environment.name]=${COMMUNITY_OBSERVABILITY_ENVIRONMENT:${KNODE_ENVIRONMENT:}}
management.tracing.enabled=${COMMUNITY_OBSERVABILITY_ENABLED:false}
management.otlp.tracing.endpoint=${COMMUNITY_OTLP_ENDPOINT:}
management.tracing.sampling.probability=${COMMUNITY_TRACING_SAMPLE_RATE:0.1}
management.tracing.opentelemetry.export.max-queue-size=512
management.tracing.opentelemetry.export.max-batch-size=128
management.tracing.opentelemetry.export.schedule-delay=1s
management.tracing.opentelemetry.export.timeout=2s
management.otlp.tracing.timeout=2s
management.otlp.tracing.connect-timeout=1s
management.tracing.propagation.consume=W3C
management.tracing.propagation.produce=W3C
management.tracing.baggage.enabled=false
management.tracing.baggage.correlation.enabled=false
