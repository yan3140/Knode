server:
  port: ${GATEWAY_PORT:18089}
  forward-headers-strategy: none
spring:
  reactor:
    context-propagation: auto
  application:
    name: knode-gateway
  config:
    import: ${NACOS_CONFIG_IMPORT:}
  cloud:
    nacos:
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        group: ${NACOS_DISCOVERY_GROUP:DEFAULT_GROUP}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_DISCOVERY_NAMESPACE:${NACOS_NAMESPACE:}}
      config:
        group: ${NACOS_GROUP:KNODE_SERVICE}
        enabled: ${NACOS_CONFIG_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_CONFIG_NAMESPACE:${NACOS_NAMESPACE:}}
management:
  tracing:
    enabled: ${KNODE_OBSERVABILITY_ENABLED:false}
    sampling:
      probability: ${KNODE_TRACE_SAMPLE_RATIO:0.1}
    baggage:
      enabled: false
    propagation:
      type: w3c
    opentelemetry:
      export:
        max-queue-size: 512
        max-batch-size: 128
        schedule-delay: 1s
        timeout: 2s
  otlp:
    tracing:
      endpoint: ${KNODE_OTLP_TRACES_ENDPOINT:}
      timeout: 2s
      connect-timeout: 1s
  opentelemetry:
    resource-attributes:
      "[service.name]": ${spring.application.name}
      "[service.version]": ${KNODE_SERVICE_VERSION:}
      "[deployment.environment.name]": ${KNODE_ENVIRONMENT:}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  health:
    redis:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,authentication,governance
  endpoints:
    web:
      exposure:
        include: health
knode:
  observability:
    enabled: ${KNODE_OBSERVABILITY_ENABLED:false}
    environment: ${KNODE_ENVIRONMENT:}
    version: ${KNODE_SERVICE_VERSION:}
  governance:
    nacos:
      enabled: ${KNODE_GOV_NACOS_ENABLED:false}
      retry-min-ms: ${KNODE_GOV_NACOS_RETRY_MIN_MS:1000}
      retry-max-ms: ${KNODE_GOV_NACOS_RETRY_MAX_MS:30000}
      server-addr: ${KNODE_GOV_NACOS_SERVER_ADDR:}
      namespace: ${KNODE_GOV_NACOS_NAMESPACE:}
      group: ${KNODE_GOV_NACOS_GROUP:KNODE_SENTINEL}
      username: ${KNODE_GOV_NACOS_USERNAME:}
      password: ${KNODE_GOV_NACOS_PASSWORD:}

  gateway:
    auth:
      configured: ${KNODE_GATEWAY_AUTH_CONFIGURED:false}
      public-keys: ${KNODE_GATEWAY_AUTH_PUBLIC_KEYS:}
      environment: ${KNODE_GATEWAY_AUTH_ENVIRONMENT:}
      redis-host: ${KNODE_GATEWAY_AUTH_REDIS_HOST:}
      redis-port: ${KNODE_GATEWAY_AUTH_REDIS_PORT:0}
      redis-username: ${KNODE_GATEWAY_AUTH_REDIS_USERNAME:}
      redis-password: ${KNODE_GATEWAY_AUTH_REDIS_PASSWORD:}
      redis-database: ${KNODE_GATEWAY_AUTH_REDIS_DATABASE:0}
      redis-tls: ${KNODE_GATEWAY_AUTH_REDIS_TLS:true}
      timeout-ms: ${KNODE_GATEWAY_AUTH_TIMEOUT_MS:1000}
