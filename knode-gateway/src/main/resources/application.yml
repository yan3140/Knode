spring:
  application:
    name: knode-gateway
  config:
    import: ${NACOS_CONFIG_IMPORT:}
  cloud:
    nacos:
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
      config:
        group: ${NACOS_GROUP:KNODE_SERVICE}
        enabled: ${NACOS_CONFIG_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,authentication,governance
  endpoints:
    web:
      exposure:
        include: health
knode:
  governance:
    nacos:
      enabled: ${KNODE_GOV_NACOS_ENABLED:false}
      server-addr: ${KNODE_GOV_NACOS_SERVER_ADDR:}
      namespace: ${KNODE_GOV_NACOS_NAMESPACE:}
      group: ${KNODE_GOV_NACOS_GROUP:KNODE_SENTINEL}
      username: ${KNODE_GOV_NACOS_USERNAME:}
      password: ${KNODE_GOV_NACOS_PASSWORD:}
