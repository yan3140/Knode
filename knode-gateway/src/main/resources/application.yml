server:
  forward-headers-strategy: none
spring:
  application:
    name: knode-gateway
  config:
    import: ${NACOS_CONFIG_IMPORT:}
  cloud:
    nacos:
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
      config:
        group: ${NACOS_GROUP:KNODE_SERVICE}
        enabled: ${NACOS_CONFIG_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
management:
  health:
    redis:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,authentication,governance
  endpoints:
    web:
      exposure:
        include: health
knode:
  governance:
    nacos:
      enabled: ${KNODE_GOV_NACOS_ENABLED:false}
      server-addr: ${KNODE_GOV_NACOS_SERVER_ADDR:}
      namespace: ${KNODE_GOV_NACOS_NAMESPACE:}
      group: ${KNODE_GOV_NACOS_GROUP:KNODE_SENTINEL}
      username: ${KNODE_GOV_NACOS_USERNAME:}
      password: ${KNODE_GOV_NACOS_PASSWORD:}

  gateway:
    auth:
      configured: ${KNODE_GATEWAY_AUTH_CONFIGURED:false}
      public-keys: ${KNODE_GATEWAY_AUTH_PUBLIC_KEYS:}
      environment: ${KNODE_GATEWAY_AUTH_ENVIRONMENT:}
      redis-host: ${KNODE_GATEWAY_AUTH_REDIS_HOST:}
      redis-port: ${KNODE_GATEWAY_AUTH_REDIS_PORT:0}
      redis-username: ${KNODE_GATEWAY_AUTH_REDIS_USERNAME:}
      redis-password: ${KNODE_GATEWAY_AUTH_REDIS_PASSWORD:}
      redis-database: ${KNODE_GATEWAY_AUTH_REDIS_DATABASE:0}
      timeout-ms: ${KNODE_GATEWAY_AUTH_TIMEOUT_MS:1000}
