spring.application.name=knode-content
spring.datasource.url=${KNODE_CONTENT_JDBC_URL}
spring.datasource.username=${KNODE_CONTENT_DB_USERNAME}
spring.datasource.password=${KNODE_CONTENT_DB_PASSWORD}
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.liquibase.enabled=false
spring.data.redis.host=${KNODE_AUTH_REDIS_HOST}
spring.data.redis.port=${KNODE_AUTH_REDIS_PORT}
spring.data.redis.username=${KNODE_AUTH_REDIS_USERNAME}
spring.data.redis.password=${KNODE_AUTH_REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=false
management.endpoint.health.group.readiness.include=readinessState,db,authSession
management.endpoint.health.show-details=never
management.server.port=${KNODE_MANAGEMENT_PORT}
management.server.address=127.0.0.1
server.address=127.0.0.1
server.port=${KNODE_CONTENT_PORT}

knode.content.metadata-worker.enabled=${KNODE_CONTENT_METADATA_WORKER_ENABLED:false}
knode.content.metadata-worker.batch-size=${KNODE_CONTENT_METADATA_WORKER_BATCH_SIZE:20}
knode.content.metadata-worker.delay-ms=${KNODE_CONTENT_METADATA_WORKER_DELAY_MS:5000}

# Bounded multipart uploads; storage stays disabled unless explicitly configured.
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1088KB
spring.servlet.multipart.file-size-threshold=1MB
server.tomcat.max-part-count=2
server.tomcat.max-part-header-size=2KB
logging.level.com.aliyun.oss=OFF
logging.level.org.apache.http.wire=OFF
logging.level.org.apache.http.headers=OFF
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=INFO

# Client IP for comment rate limits always comes from the direct socket peer.
server.forward-headers-strategy=none
