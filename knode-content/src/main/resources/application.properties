spring.application.name=knode-content
spring.datasource.url=${KNODE_CONTENT_JDBC_URL}
spring.datasource.username=${KNODE_CONTENT_DB_USERNAME}
spring.datasource.password=${KNODE_CONTENT_DB_PASSWORD}
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.liquibase.enabled=false
spring.data.redis.host=${KNODE_AUTH_REDIS_HOST}
spring.data.redis.port=${KNODE_AUTH_REDIS_PORT}
spring.data.redis.username=${KNODE_AUTH_REDIS_USERNAME}
spring.data.redis.password=${KNODE_AUTH_REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=false
management.endpoint.health.group.readiness.include=readinessState,db,authSession,contentDiscovery,contentGovernance
management.endpoint.health.show-details=never
management.server.port=${KNODE_MANAGEMENT_PORT}
management.server.address=127.0.0.1
server.address=127.0.0.1
server.port=${KNODE_CONTENT_PORT}

spring.cloud.nacos.discovery.enabled=${CONTENT_NACOS_DISCOVERY_ENABLED:false}
spring.cloud.nacos.config.enabled=false
spring.cloud.nacos.discovery.server-addr=${CONTENT_NACOS_SERVER_ADDR:${NACOS_SERVER_ADDR:}}
spring.cloud.nacos.discovery.namespace=${CONTENT_NACOS_NAMESPACE:${NACOS_NAMESPACE:}}
spring.cloud.nacos.discovery.group=${CONTENT_NACOS_GROUP:${NACOS_GROUP:DEFAULT_GROUP}}
spring.cloud.nacos.discovery.username=${CONTENT_NACOS_USERNAME:${NACOS_USERNAME:}}
spring.cloud.nacos.discovery.password=${CONTENT_NACOS_PASSWORD:${NACOS_PASSWORD:}}

knode.governance.enabled=${CONTENT_GOVERNANCE_ENABLED:false}
knode.governance.nacos.server-addr=${CONTENT_NACOS_SERVER_ADDR:${NACOS_SERVER_ADDR:}}
knode.governance.nacos.namespace=${CONTENT_NACOS_NAMESPACE:${NACOS_NAMESPACE:}}
knode.governance.nacos.group=${CONTENT_GOVERNANCE_GROUP:KNODE_SENTINEL}
knode.governance.nacos.username=${CONTENT_NACOS_USERNAME:${NACOS_USERNAME:}}
knode.governance.nacos.password=${CONTENT_NACOS_PASSWORD:${NACOS_PASSWORD:}}

knode.observability.enabled=${CONTENT_OBSERVABILITY_ENABLED:false}
knode.observability.environment=${CONTENT_OBSERVABILITY_ENVIRONMENT:${KNODE_ENVIRONMENT:}}
knode.observability.version=${CONTENT_OBSERVABILITY_VERSION:}
management.opentelemetry.resource-attributes[service.name]=${spring.application.name}
management.opentelemetry.resource-attributes[service.version]=${CONTENT_OBSERVABILITY_VERSION:}
management.opentelemetry.resource-attributes[deployment.environment.name]=${CONTENT_OBSERVABILITY_ENVIRONMENT:${KNODE_ENVIRONMENT:}}
management.tracing.enabled=${CONTENT_OBSERVABILITY_ENABLED:false}
management.otlp.tracing.endpoint=${CONTENT_OTLP_ENDPOINT:}
management.tracing.sampling.probability=${CONTENT_TRACING_SAMPLE_RATE:0.1}
management.tracing.opentelemetry.export.max-queue-size=512
management.tracing.opentelemetry.export.max-batch-size=128
management.tracing.opentelemetry.export.schedule-delay=1s
management.tracing.opentelemetry.export.timeout=2s
management.otlp.tracing.timeout=2s
management.otlp.tracing.connect-timeout=1s
management.tracing.propagation.consume=W3C
management.tracing.propagation.produce=W3C
management.tracing.baggage.enabled=false
management.tracing.baggage.correlation.enabled=false

knode.content.metadata-worker.enabled=${KNODE_CONTENT_METADATA_WORKER_ENABLED:false}
knode.content.metadata-worker.batch-size=${KNODE_CONTENT_METADATA_WORKER_BATCH_SIZE:20}
knode.content.metadata-worker.delay-ms=${KNODE_CONTENT_METADATA_WORKER_DELAY_MS:5000}

# Bounded multipart uploads; storage stays disabled unless explicitly configured.
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1088KB
spring.servlet.multipart.file-size-threshold=1MB
server.tomcat.max-part-count=2
server.tomcat.max-part-header-size=2KB
logging.level.com.aliyun.oss=OFF
logging.level.org.apache.http.wire=OFF
logging.level.org.apache.http.headers=OFF
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=INFO

# Client IP for comment rate limits always comes from the direct socket peer.
server.forward-headers-strategy=none
