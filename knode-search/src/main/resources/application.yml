server:
  port: ${SEARCH_PORT:18093}

spring:
  application:
    name: knode-search
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
      - org.springframework.boot.autoconfigure.sql.init.SqlInitializationAutoConfiguration
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,metrics

knode:
  environment: ${KNODE_ENVIRONMENT:local}
  search:
    elasticsearch:
      url: ${KNODE_SEARCH_ES_URL:http://127.0.0.1:9200}
      index: ${KNODE_SEARCH_ES_INDEX:knode_local_articles_search}
      connect-timeout-ms: ${KNODE_SEARCH_ES_CONNECT_TIMEOUT_MS:500}
      connection-request-timeout-ms: ${KNODE_SEARCH_ES_CONN_REQ_TIMEOUT_MS:500}
      response-timeout-ms: ${KNODE_SEARCH_ES_RESPONSE_TIMEOUT_MS:1500}
    query:
      max-keyword-length: 40
      default-page-size: 5
      max-page-size: 20
      max-page-num: 50
      total-hit-threshold: 10000
      highlight-content: false
      total-timeout-ms: ${KNODE_SEARCH_TOTAL_TIMEOUT_MS:3000}
    cache:
      enabled: ${KNODE_SEARCH_CACHE_ENABLED:false}
      max-page-size: 20
      admission-threshold: 2
      admission-ttl-seconds: 60
      result-ttl-seconds: 60
      empty-ttl-seconds: 30
      jitter-seconds: 30
      redis:
        host: ${KNODE_SEARCH_CACHE_REDIS_HOST:127.0.0.1}
        port: ${KNODE_SEARCH_CACHE_REDIS_PORT:6379}
        database: ${KNODE_SEARCH_CACHE_REDIS_DATABASE:0}
        username: ${KNODE_SEARCH_CACHE_REDIS_USERNAME:}
        password: ${KNODE_SEARCH_CACHE_REDIS_PASSWORD:}
        tls: ${KNODE_SEARCH_CACHE_REDIS_TLS:false}
        connect-timeout-ms: ${KNODE_SEARCH_CACHE_REDIS_CONNECT_TIMEOUT_MS:300}
        command-timeout-ms: ${KNODE_SEARCH_CACHE_REDIS_COMMAND_TIMEOUT_MS:300}
    clients:
      user-origin: ${KNODE_USER_ORIGIN:}
      content-origin: ${KNODE_CONTENT_ORIGIN:}
      service-id: ${KNODE_SEARCH_SERVICE_ID:knode-search}
      bootstrap-secret: ${KNODE_SEARCH_BOOTSTRAP_SECRET:}
      connect-timeout-ms: ${KNODE_SEARCH_CLIENT_CONNECT_TIMEOUT_MS:500}
      user-token-timeout-ms: ${KNODE_SEARCH_USER_TOKEN_TIMEOUT_MS:800}
      content-visibility-timeout-ms: ${KNODE_SEARCH_CONTENT_VISIBILITY_TIMEOUT_MS:1000}
      token-refresh-skew-seconds: 10
    consumer:
      enabled: ${KNODE_SEARCH_CONSUMER_ENABLED:false}
      datasource:
        url: ${KNODE_SEARCH_DB_URL:}
        driver-class-name: ${KNODE_SEARCH_DB_DRIVER:com.mysql.cj.jdbc.Driver}
        username: ${KNODE_SEARCH_DB_USERNAME:}
        password: ${KNODE_SEARCH_DB_PASSWORD:}
        maximum-pool-size: ${KNODE_SEARCH_DB_MAX_POOL_SIZE:10}
        connection-timeout-ms: ${KNODE_SEARCH_DB_CONN_TIMEOUT_MS:3000}
        transaction-timeout-seconds: ${KNODE_SEARCH_DB_TX_TIMEOUT_SECONDS:5}
      stream:
        enabled: ${KNODE_SEARCH_STREAM_ENABLED:false}
        worker-enabled: ${KNODE_SEARCH_STREAM_WORKER_ENABLED:false}
        group: ${KNODE_SEARCH_STREAM_GROUP:knode-search-v1}
        consumer-name: ${KNODE_SEARCH_STREAM_CONSUMER_NAME:}
        batch-size: ${KNODE_SEARCH_STREAM_BATCH_SIZE:10}
        block-timeout-ms: ${KNODE_SEARCH_STREAM_BLOCK_TIMEOUT_MS:200}
        min-idle-ms: ${KNODE_SEARCH_STREAM_MIN_IDLE_MS:30000}
        poll-delay-ms: ${KNODE_SEARCH_STREAM_POLL_DELAY_MS:1000}
        redis:
          host: ${KNODE_SEARCH_STREAM_REDIS_HOST:127.0.0.1}
          port: ${KNODE_SEARCH_STREAM_REDIS_PORT:6379}
          database: ${KNODE_SEARCH_STREAM_REDIS_DATABASE:0}
          username: ${KNODE_SEARCH_STREAM_REDIS_USERNAME:}
          password: ${KNODE_SEARCH_STREAM_REDIS_PASSWORD:}
          tls: ${KNODE_SEARCH_STREAM_REDIS_TLS:false}
          connect-timeout-ms: ${KNODE_SEARCH_STREAM_REDIS_CONNECT_TIMEOUT_MS:400}
          command-timeout-ms: ${KNODE_SEARCH_STREAM_REDIS_COMMAND_TIMEOUT_MS:800}
      indexer:
        enabled: ${KNODE_SEARCH_INDEXER_ENABLED:false}
        worker-enabled: ${KNODE_SEARCH_INDEXER_WORKER_ENABLED:false}
        batch-size: ${KNODE_SEARCH_INDEXER_BATCH_SIZE:10}
        lease-seconds: ${KNODE_SEARCH_INDEXER_LEASE_SECONDS:30}
        max-attempts: ${KNODE_SEARCH_INDEXER_MAX_ATTEMPTS:5}
        base-retry-delay-ms: ${KNODE_SEARCH_INDEXER_BASE_RETRY_DELAY_MS:1000}
        max-retry-delay-ms: ${KNODE_SEARCH_INDEXER_MAX_RETRY_DELAY_MS:60000}
        poll-delay-ms: ${KNODE_SEARCH_INDEXER_POLL_DELAY_MS:1000}
        refresh-policy: ${KNODE_SEARCH_INDEXER_REFRESH_POLICY:wait_for}
        cache-compensation-batch-size: ${KNODE_SEARCH_CACHE_COMP_BATCH_SIZE:20}
        cache-compensation-base-delay-ms: ${KNODE_SEARCH_CACHE_COMP_BASE_DELAY_MS:1000}
        cache-compensation-max-delay-ms: ${KNODE_SEARCH_CACHE_COMP_MAX_DELAY_MS:30000}
